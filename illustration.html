<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illustration Gallery</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="illustration.css">
</head>

<body>
    <div class="overlay"></div>

    <section id="illustration" class="container">

        <div class="y2k-window fade-in-up">
            <div class="window-header">
                <div class="window-title">gallery_viewer.exe</div>
                <div class="window-controls">
                    <div class="win-btn">_</div>
                    <div class="win-btn">[]</div>
                    <div class="win-btn">X</div>
                </div>
            </div>

            <div class="window-content">
                <div class="gallery-header">
                    <h2>:: SYSTEM_GALLERY ::</h2>
                    <div class="back-button">
                        <a href="index.html" class="btn-clean">&lt; RETURN_MAIN</a>
                    </div>
                </div>

                <!-- Static Gallery -->
                <div class="static-gallery">
                    <div class="gallery-item"><img src="./img/1.jpg" alt="Gallery Image 1"></div>
                    <div class="gallery-item"><img src="./img/2.jpg" alt="Gallery Image 2"></div>
                    <div class="gallery-item"><img src="./img/3.jpg" alt="Gallery Image 3"></div>
                    <div class="gallery-item"><img src="./img/4.jpg" alt="Gallery Image 4"></div>
                    <div class="gallery-item"><img src="./img/5.jpg" alt="Gallery Image 5"></div>
                    <div class="gallery-item"><img src="./img/6.jpg" alt="Gallery Image 6"></div>
                    <div class="gallery-item"><img src="./img/7.jpg" alt="Gallery Image 7"></div>
                    <div class="gallery-item"><img src="./img/8.jpg" alt="Gallery Image 8"></div>
                    <div class="gallery-item"><img src="./img/9.jpg" alt="Gallery Image 9"></div>
                    <div class="gallery-item"><img src="./img/10.jpg" alt="Gallery Image 10"></div>
                    <div class="gallery-item"><img src="./img/11.jpg" alt="Gallery Image 11"></div>
                    <div class="gallery-item"><img src="./img/12.jpg" alt="Gallery Image 12"></div>
                    <div class="gallery-item"><img src="./img/13.jpg" alt="Gallery Image 13"></div>
                    <div class="gallery-item"><img src="./img/14.jpg" alt="Gallery Image 14"></div>
                    <div class="gallery-item"><img src="./img/15.jpg" alt="Gallery Image 15"></div>
                    <div class="gallery-item"><img src="./img/16.jpg" alt="Gallery Image 16"></div>
                    <div class="gallery-item"><img src="./img/17.jpg" alt="Gallery Image 17"></div>
                    <div class="gallery-item"><img src="./img/18.jpg" alt="Gallery Image 18"></div>
                    <div class="gallery-item"><img src="./img/19.jpg" alt="Gallery Image 19"></div>
                    <div class="gallery-item"><img src="./img/20.jpg" alt="Gallery Image 20"></div>
                </div>
            </div>
        </div>

    </section>

    <!-- Full Screen Image Modal -->
    <div id="imageModal" class="image-modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="fullImage">
        <div id="caption"></div>
    </div>

    <script src="illust.js"></script>
</body>

</html>
